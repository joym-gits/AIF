<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#0f0f13"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#e2e8f0">AIF System Architecture</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748b">AI Intelligence Feed — Open Protocol for AI-Generated Intelligence Streams</text>

  <!-- ═══════════ SECTION: DATA SOURCES (left) ═══════════ -->
  <text x="80" y="120" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">DATA SOURCES</text>

  <rect x="40" y="138" width="180" height="44" rx="8" fill="#1a1a24" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="165" font-size="13" fill="#e2e8f0">RSS Feeds</text>
  <text x="170" y="165" font-size="10" fill="#64748b" text-anchor="end">arXiv, HN, BBC</text>

  <rect x="40" y="192" width="180" height="44" rx="8" fill="#1a1a24" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="219" font-size="13" fill="#e2e8f0">Web Pages</text>
  <text x="170" y="219" font-size="10" fill="#64748b" text-anchor="end">FDA, SEC, WHO</text>

  <rect x="40" y="246" width="180" height="44" rx="8" fill="#1a1a24" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="273" font-size="13" fill="#e2e8f0">APIs</text>
  <text x="170" y="273" font-size="10" fill="#64748b" text-anchor="end">any HTTPS source</text>

  <!-- ═══════════ SECTION: AGENT RUNNER (center-left) ═══════════ -->
  <text x="330" y="120" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">AGENT RUNNER</text>
  <text x="330" y="135" font-size="9" fill="#4a5568">npm: aif-agent-runner</text>

  <rect x="290" y="148" width="220" height="160" rx="12" fill="#1e1b2e" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="308" y="168" width="184" height="34" rx="6" fill="#2a2440" stroke="#4f46e5" stroke-width="1"/>
  <text x="400" y="190" text-anchor="middle" font-size="12" fill="#c4b5fd" font-weight="600">Source Fetcher</text>

  <rect x="308" y="212" width="184" height="34" rx="6" fill="#2a2440" stroke="#4f46e5" stroke-width="1"/>
  <text x="400" y="234" text-anchor="middle" font-size="12" fill="#c4b5fd" font-weight="600">Claude / Anthropic API</text>

  <rect x="308" y="256" width="184" height="34" rx="6" fill="#2a2440" stroke="#4f46e5" stroke-width="1"/>
  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#c4b5fd" font-weight="600">Item Publisher</text>

  <!-- Arrows: sources → agent -->
  <line x1="220" y1="160" x2="285" y2="185" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="214" x2="285" y2="210" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="220" y1="268" x2="285" y2="240" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User's infra label -->
  <rect x="270" y="320" width="260" height="24" rx="4" fill="#1a1a24" stroke="#334155" stroke-width="1"/>
  <text x="400" y="337" text-anchor="middle" font-size="10" fill="#94a3b8">Runs on user's infra (GitHub Actions / local)</text>

  <!-- ═══════════ SECTION: BACKEND (center) ═══════════ -->
  <text x="620" y="120" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">AIF BACKEND</text>
  <text x="620" y="135" font-size="9" fill="#4a5568">Express + Supabase · Cloud Run</text>

  <rect x="560" y="148" width="300" height="320" rx="12" fill="#1a1a24" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- API routes -->
  <rect x="578" y="168" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="189" font-size="11" fill="#86efac" font-weight="600">REST API</text>
  <text x="830" y="189" font-size="10" fill="#4ade80" text-anchor="end">/api/v1/*</text>

  <rect x="578" y="212" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="233" font-size="11" fill="#86efac" font-weight="600">Auth Middleware</text>
  <text x="830" y="233" font-size="10" fill="#4ade80" text-anchor="end">JWT + API Keys</text>

  <rect x="578" y="256" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="277" font-size="11" fill="#86efac" font-weight="600">Feed Registry</text>
  <text x="830" y="277" font-size="10" fill="#4ade80" text-anchor="end">CRUD + validation</text>

  <rect x="578" y="300" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="321" font-size="11" fill="#86efac" font-weight="600">AIF JSON Server</text>
  <text x="830" y="321" font-size="10" fill="#4ade80" text-anchor="end">/feeds/:id/aif.json</text>

  <rect x="578" y="344" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="365" font-size="11" fill="#86efac" font-weight="600">Share Card Generator</text>
  <text x="830" y="365" font-size="10" fill="#4ade80" text-anchor="end">OG image + meta</text>

  <rect x="578" y="388" width="264" height="34" rx="6" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="590" y="409" font-size="11" fill="#86efac" font-weight="600">Feed Refresh Scheduler</text>
  <text x="830" y="409" font-size="10" fill="#4ade80" text-anchor="end">node-cron · 15min</text>

  <rect x="578" y="432" width="126" height="24" rx="4" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="641" y="449" text-anchor="middle" font-size="10" fill="#4ade80">Rate Limiter</text>

  <rect x="716" y="432" width="126" height="24" rx="4" fill="#0f2918" stroke="#16a34a" stroke-width="1"/>
  <text x="779" y="449" text-anchor="middle" font-size="10" fill="#4ade80">pino Logging</text>

  <!-- Arrow: agent → backend -->
  <line x1="510" y1="273" x2="555" y2="273" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="533" y="265" text-anchor="middle" font-size="9" fill="#6366f1">POST</text>
  <text x="533" y="285" text-anchor="middle" font-size="8" fill="#4a5568">aif_sk_</text>

  <!-- ═══════════ SECTION: DATABASE (bottom center) ═══════════ -->
  <text x="620" y="510" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">DATABASE</text>
  <text x="620" y="525" font-size="9" fill="#4a5568">Supabase (Postgres + Auth)</text>

  <rect x="560" y="538" width="300" height="140" rx="12" fill="#1a1a24" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="578" y="556" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="641" y="575" text-anchor="middle" font-size="11" fill="#fcd34d">feeds</text>

  <rect x="716" y="556" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="779" y="575" text-anchor="middle" font-size="11" fill="#fcd34d">feed_items</text>

  <rect x="578" y="594" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="641" y="613" text-anchor="middle" font-size="11" fill="#fcd34d">subscriptions</text>

  <rect x="716" y="594" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="779" y="613" text-anchor="middle" font-size="11" fill="#fcd34d">profiles</text>

  <rect x="578" y="632" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="641" y="651" text-anchor="middle" font-size="11" fill="#fcd34d">api_keys</text>

  <rect x="716" y="632" width="126" height="28" rx="5" fill="#1c1508" stroke="#d97706" stroke-width="1"/>
  <text x="779" y="651" text-anchor="middle" font-size="11" fill="#fcd34d">auth.users</text>

  <!-- Arrow: backend → database -->
  <line x1="710" y1="470" x2="710" y2="533" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- ═══════════ SECTION: SECRETS (bottom left) ═══════════ -->
  <text x="130" y="510" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">SECRETS</text>

  <rect x="40" y="528" width="230" height="100" rx="12" fill="#1a1a24" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow)"/>

  <rect x="58" y="546" width="194" height="26" rx="5" fill="#1c0808" stroke="#dc2626" stroke-width="1"/>
  <text x="155" y="564" text-anchor="middle" font-size="10" fill="#fca5a5">GCP Secret Manager</text>

  <rect x="58" y="580" width="92" height="26" rx="5" fill="#1c0808" stroke="#dc2626" stroke-width="1"/>
  <text x="104" y="598" text-anchor="middle" font-size="9" fill="#fca5a5">Supabase keys</text>

  <rect x="160" y="580" width="92" height="26" rx="5" fill="#1c0808" stroke="#dc2626" stroke-width="1"/>
  <text x="206" y="598" text-anchor="middle" font-size="9" fill="#fca5a5">API key hashes</text>

  <!-- Arrow: secrets → backend -->
  <line x1="270" y1="570" x2="555" y2="430" stroke="#ef4444" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow-gray)"/>

  <!-- ═══════════ SECTION: CONSUMERS (right side) ═══════════ -->
  <text x="1010" y="120" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">CONSUMERS</text>

  <!-- Publisher Dashboard -->
  <rect x="940" y="148" width="220" height="64" rx="10" fill="#1a1a24" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="952" y="155" width="36" height="18" rx="4" fill="#6366f1"/>
  <text x="970" y="168" text-anchor="middle" font-size="8" fill="white" font-weight="700">PUB</text>
  <text x="998" y="170" font-size="13" fill="#e2e8f0" font-weight="600">Publisher Dashboard</text>
  <text x="998" y="190" font-size="10" fill="#64748b">React 18 · Vite · Tailwind</text>
  <text x="998" y="203" font-size="9" fill="#4a5568">Firebase Hosting</text>

  <!-- Reader App -->
  <rect x="940" y="228" width="220" height="64" rx="10" fill="#1a1a24" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="952" y="235" width="36" height="18" rx="4" fill="#3b82f6"/>
  <text x="970" y="248" text-anchor="middle" font-size="8" fill="white" font-weight="700">READ</text>
  <text x="998" y="250" font-size="13" fill="#e2e8f0" font-weight="600">Reader App</text>
  <text x="998" y="270" font-size="10" fill="#64748b">React 18 · TanStack Query</text>
  <text x="998" y="283" font-size="9" fill="#4a5568">Firebase Hosting</text>

  <!-- Chrome Extension -->
  <rect x="940" y="308" width="220" height="64" rx="10" fill="#1a1a24" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="952" y="315" width="36" height="18" rx="4" fill="#f59e0b"/>
  <text x="970" y="328" text-anchor="middle" font-size="8" fill="white" font-weight="700">EXT</text>
  <text x="998" y="330" font-size="13" fill="#e2e8f0" font-weight="600">Browser Extension</text>
  <text x="998" y="350" font-size="10" fill="#64748b">Chrome MV3 · TypeScript</text>
  <text x="998" y="363" font-size="9" fill="#4a5568">Feed discovery + AI injection</text>

  <!-- Subscribe Widget -->
  <rect x="940" y="388" width="220" height="50" rx="10" fill="#1a1a24" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="952" y="395" width="36" height="18" rx="4" fill="#8b5cf6"/>
  <text x="970" y="408" text-anchor="middle" font-size="7" fill="white" font-weight="700">JS</text>
  <text x="998" y="410" font-size="13" fill="#e2e8f0" font-weight="600">Subscribe Widget</text>
  <text x="998" y="428" font-size="10" fill="#64748b">Embeddable vanilla JS</text>

  <!-- Arrows: backend → consumers -->
  <line x1="860" y1="200" x2="935" y2="180" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="240" x2="935" y2="260" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="320" x2="935" y2="340" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="370" x2="935" y2="413" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════ SECTION: AI PLATFORMS (far right bottom) ═══════════ -->
  <text x="1010" y="480" font-size="11" fill="#64748b" font-weight="600" letter-spacing="1.5">AI PLATFORMS</text>
  <text x="1010" y="495" font-size="9" fill="#4a5568">Context injection via extension</text>

  <rect x="940" y="508" width="100" height="34" rx="6" fill="#1a1a24" stroke="#334155" stroke-width="1"/>
  <text x="990" y="530" text-anchor="middle" font-size="11" fill="#e2e8f0">Claude</text>

  <rect x="1050" y="508" width="100" height="34" rx="6" fill="#1a1a24" stroke="#334155" stroke-width="1"/>
  <text x="1100" y="530" text-anchor="middle" font-size="11" fill="#e2e8f0">ChatGPT</text>

  <rect x="940" y="552" width="100" height="34" rx="6" fill="#1a1a24" stroke="#334155" stroke-width="1"/>
  <text x="990" y="574" text-anchor="middle" font-size="11" fill="#e2e8f0">Gemini</text>

  <rect x="1050" y="552" width="100" height="34" rx="6" fill="#1a1a24" stroke="#334155" stroke-width="1"/>
  <text x="1100" y="574" text-anchor="middle" font-size="11" fill="#e2e8f0">Mistral</text>

  <!-- Arrow: extension → AI platforms -->
  <line x1="1050" y1="372" x2="1050" y2="503" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <text x="1063" y="440" font-size="9" fill="#64748b">inject</text>

  <!-- ═══════════ SECTION: VIRAL LOOP (bottom) ═══════════ -->
  <rect x="40" y="720" width="1120" height="140" rx="14" fill="#1a1a24" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="600" y="750" text-anchor="middle" font-size="13" fill="#64748b" font-weight="600" letter-spacing="1.5">VIRAL LOOP</text>

  <!-- Step 1 -->
  <circle cx="140" cy="800" r="22" fill="#6366f1"/>
  <text x="140" y="806" text-anchor="middle" font-size="14" fill="white" font-weight="700">1</text>
  <text x="140" y="838" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="600">Publisher</text>
  <text x="140" y="852" text-anchor="middle" font-size="9" fill="#64748b">embeds widget</text>

  <!-- Step 2 -->
  <circle cx="360" cy="800" r="22" fill="#3b82f6"/>
  <text x="360" y="806" text-anchor="middle" font-size="14" fill="white" font-weight="700">2</text>
  <text x="360" y="838" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="600">Reader</text>
  <text x="360" y="852" text-anchor="middle" font-size="9" fill="#64748b">subscribes + installs ext</text>

  <!-- Step 3 -->
  <circle cx="580" cy="800" r="22" fill="#f59e0b"/>
  <text x="580" y="806" text-anchor="middle" font-size="14" fill="white" font-weight="700">3</text>
  <text x="580" y="838" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="600">Inject</text>
  <text x="580" y="852" text-anchor="middle" font-size="9" fill="#64748b">into AI chat</text>

  <!-- Step 4 -->
  <circle cx="800" cy="800" r="22" fill="#22c55e"/>
  <text x="800" y="806" text-anchor="middle" font-size="14" fill="white" font-weight="700">4</text>
  <text x="800" y="838" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="600">Share</text>
  <text x="800" y="852" text-anchor="middle" font-size="9" fill="#64748b">OG card on social</text>

  <!-- Step 5 -->
  <circle cx="1020" cy="800" r="22" fill="#8b5cf6"/>
  <text x="1020" y="806" text-anchor="middle" font-size="14" fill="white" font-weight="700">5</text>
  <text x="1020" y="838" text-anchor="middle" font-size="11" fill="#e2e8f0" font-weight="600">New reader</text>
  <text x="1020" y="852" text-anchor="middle" font-size="9" fill="#64748b">discovers + subscribes</text>

  <!-- Arrows between steps -->
  <line x1="165" y1="800" x2="333" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="385" y1="800" x2="553" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="605" y1="800" x2="773" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <line x1="825" y1="800" x2="993" y2="800" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Loop-back arrow -->
  <path d="M1045 790 Q1100 750 1100 720 Q1100 700 1050 700 L140 700 Q90 700 90 720 Q90 750 115 790" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="600" y="696" text-anchor="middle" font-size="9" fill="#8b5cf6">cycle repeats</text>

  <!-- ═══════════ LEGEND ═══════════ -->
  <rect x="40" y="660" width="180" height="20" rx="0" fill="none"/>
  <line x1="50" y1="670" x2="80" y2="670" stroke="#6366f1" stroke-width="2"/>
  <text x="88" y="674" font-size="9" fill="#64748b">Data flow</text>
  <line x1="130" y1="670" x2="160" y2="670" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="168" y="674" font-size="9" fill="#64748b">Indirect / async</text>
</svg>
