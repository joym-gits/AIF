<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <title>AIF Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: { colors: { brand: "#6366f1" } } },
      };
    </script>
    <style>
      html, body { width: 400px; }
      body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100">
    <header class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded bg-brand flex items-center justify-center text-xs font-bold">AIF</div>
        <h1 class="text-sm font-semibold">AIF Reader</h1>
      </div>
      <button id="btn-settings" class="text-slate-400 hover:text-white" title="Settings">⚙</button>
    </header>

    <nav class="flex border-b border-slate-800 text-sm" id="tabs">
      <button data-tab="page" class="tab flex-1 py-2 border-b-2 border-brand text-white">This Page</button>
      <button data-tab="mine" class="tab flex-1 py-2 border-b-2 border-transparent text-slate-400">My Feeds</button>
      <button data-tab="discover" class="tab flex-1 py-2 border-b-2 border-transparent text-slate-400">Discover</button>
    </nav>

    <main class="p-3 max-h-[480px] overflow-y-auto text-sm">
      <section data-pane="page" class="pane"></section>
      <section data-pane="mine" class="pane hidden"></section>
      <section data-pane="discover" class="pane hidden">
        <input id="search" type="search" placeholder="Search feeds…"
               class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded text-sm placeholder-slate-500" />
        <div id="search-results" class="mt-3 space-y-2"></div>
      </section>
      <section data-pane="settings" class="pane hidden"></section>
    </main>

    <script src="popup.js" type="module"></script>
  </body>
</html>
