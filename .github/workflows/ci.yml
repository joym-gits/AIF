name: CI

on:
  push:
    branches: [feat/testing]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit -- --coverage

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build:all

      - name: Generate coverage reports
        if: always()
        run: npm run test:report

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test/test-output/
          retention-days: 30

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: test/test-output/coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('test/test-output/coverage/coverage-summary.json', 'utf8'));
            const comment = `
            ## 📊 Coverage Report
            - **Statements:** ${coverage.total.statements.pct}%
            - **Branches:** ${coverage.total.branches.pct}%
            - **Functions:** ${coverage.total.functions.pct}%
            - **Lines:** ${coverage.total.lines.pct}%
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Deploy test dashboard to GitHub Pages
        if: github.ref == 'refs/heads/feat/testing' && always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'test/test-output/'

  deploy-pages:
    if: github.ref == 'refs/heads/feat/testing' && needs.test.result == 'success'
    needs: test
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

